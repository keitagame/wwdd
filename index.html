    .pbtn-s { height: 28px; min-width: 28px; padding: 0; }
    .pbtn:focus-visible, .pinput:focus-visible, .link:focus-visible, #pal button:focus-visible {
      outline: 3px dashed var(--focus); outline-offset: 5px;

    .pinput {

    #chat {

    #chat[hidden] { display: none; }
    #chatHead {

    .link {

    #chatForm { display: flex; gap: 12px; padding: 12px; border-top: 3px solid var(--edge); }
    #chatInput { flex: 1; }

    /* ---- 設定モーダル ---- */
    #settings {
      position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      padding: 20px; box-sizing: border-box;

    }
    #settings[hidden] { display: none; }
    .dialog {
      width: min(420px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
      background: var(--panel); color: var(--ink);
      box-shadow: var(--outline), 9px 9px 0 3px rgba(0,0,0,0.45);
      animation: pop 0.2s steps(4);

    @keyframes pop { from { transform: translateY(14px); } to { transform: none; } }
    .dlg-head {
      position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px 10px 16px; background: var(--accent); color: var(--accent-ink); font-size: 18px;
    }
    .dlg-body { display: flex; flex-direction: column; gap: 26px; padding: 22px 20px 24px; }
    .field { display: flex; flex-direction: column; gap: 12px; }
    .lbl { font-size: 14px; opacity: 0.8; }
    .seg { display: flex; gap: 12px; }
    .seg .pbtn { flex: 1; }
    .row { display: flex; align-items: center; gap: 14px; }
    #serverMsg { font-size: 13px; color: var(--ng); min-width: 0; }

      .dialog, #dot { animation: none; }
      .pbtn:active { transform: none; }
    }
  </style>
</head>

// 言語自動判定 (URLパラメータ > localStorage > ブラウザ言語)
function detectLanguage() {
  const urlParams = new URLSearchParams(window.location.search);
  const paramLang = urlParams.get('lang');
  if (paramLang && TRANSLATIONS[paramLang]) return paramLang;

  try {
    const saved = localStorage.getItem('dd_lang');
    if (saved && TRANSLATIONS[saved]) return saved;
  } catch (e) {}

  const navLang = (navigator.language || navigator.userLanguage || '').slice(0, 2);
  return TRANSLATIONS[navLang] ? navLang : 'ja';
}

let currentLang = detectLanguage();

function t(key) {
  return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) ||
         (TRANSLATIONS.ja && TRANSLATIONS.ja[key]) || key;
}

function updateDOMTranslations() {
  document.documentElement.lang = currentLang;

  // テキストノード更新
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key) el.textContent = t(key);
  });

  // 属性更新 (例: data-i18n-attr="placeholder:chat_placeholder,title:add_server_title")
  document.querySelectorAll('[data-i18n-attr]').forEach(el => {
    const pairs = el.getAttribute('data-i18n-attr').split(',');
    pairs.forEach(pair => {
      const [attr, key] = pair.split(':').map(s => s.trim());
      if (attr && key) el.setAttribute(attr, t(key));
    });
  });

  // メタタグ類
  document.title = t('doc_title');
  const metaDesc = document.getElementById('metaDesc');
  if (metaDesc) metaDesc.setAttribute('content', t('meta_desc'));

  // 色パレットアクセシビリティテキストの再設定
  const pal = document.getElementById('pal');
  if (pal) {
    [...pal.children].forEach((b, i) => {
      b.setAttribute('aria-label', t('color_prefix') + (i + 1));
    });
  }

  // チャット名の再レンダリング
  renderChatName();
}

const langBtns = [...document.querySelectorAll('[data-lang]')];
function syncLangButtons() {
  langBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === currentLang)));
}
syncLangButtons();
langBtns.forEach(b => b.addEventListener('click', () => {
  currentLang = b.dataset.lang;
  try { localStorage.setItem('dd_lang', currentLang); } catch (e) {}
  syncLangButtons();
  updateDOMTranslations();
  updateServerDropdown();
}));

  { name: { ja: '公式サーバー', en: 'Official Server' }, url: 'place.cgi' },

function getServerName(serverObj) {
  if (typeof serverObj.name === 'object') {
    return serverObj.name[currentLang] || serverObj.name.ja || serverObj.url;
  }
  return serverObj.name;
}

function getSavedServers() {
  try {
    const data = localStorage.getItem('dd_servers');
    return data ? JSON.parse(data) : DEFAULT_SERVERS;
  } catch (e) {
    return DEFAULT_SERVERS;
  }
}

function saveServers(servers) {
  try {
    localStorage.setItem('dd_servers', JSON.stringify(servers));

}

const urlParams = new URLSearchParams(window.location.search);
const paramServerUrl = urlParams.get('server') || urlParams.get('api');

if (paramServerUrl) {
  let existing = servers.find(s => s.url === paramServerUrl);
  if (!existing) {
    let name = paramServerUrl;
    try { name = new URL(paramServerUrl, location.href).hostname; } catch(e){}
    existing = { name: `${t('server_external')} (${name})`, url: paramServerUrl };
    servers.push(existing);
    saveServers(servers);
  }
  currentApi = paramServerUrl;
}

function addServerFromForm() {
  const trimmed = serverUrlInput.value.trim();
  if (!trimmed) { serverUrlInput.focus(); return; }

  if (servers.some(s => s.url === trimmed)) {
    serverMsg.textContent = t('server_already_exists');

  }

  let defaultName = trimmed;
  try { defaultName = new URL(trimmed, location.href).hostname || trimmed; } catch (e) {}
  const name = serverNameInput.value.trim() || defaultName;

  servers.push({ name, url: trimmed });

// ---- 地図 (MapLibre GL) ----
const MAP_STYLES = {
  liberty:  'https://tiles.openfreemap.org/styles/liberty',
  bright:   'https://tiles.openfreemap.org/styles/bright',
  positron: 'https://tiles.openfreemap.org/styles/positron'
};
let mapStyle = 'liberty';
try { const sv = localStorage.getItem('dd_style'); if (MAP_STYLES[sv]) mapStyle = sv; } catch (e) {}

let startView = { center: [139.7673068, 35.6809591], zoom: 14 };     // 初期位置 (東京)。URLの #zoom/lat/lng が優先
try {
  const v = JSON.parse(localStorage.getItem('dd_view') || 'null');
  if (v && isFinite(v.lng) && isFinite(v.lat) && isFinite(v.zoom)) startView = { center: [v.lng, v.lat], zoom: v.zoom };
} catch (e) {}

const view = document.getElementById('view');
const map = new maplibregl.Map({
  container: 'map',
  style: MAP_STYLES[mapStyle],
  center: startView.center,
  zoom: startView.zoom,
  minZoom: 2, maxZoom: 17,
  renderWorldCopies: false,
  dragRotate: false, pitchWithRotate: false, maxPitch: 0,   // 回転・傾きなし (ピクセルを軸に揃えるため)
  hash: true,
  fadeDuration: 0,
  attributionControl: { compact: true }
});
map.touchZoomRotate.disableRotation();
map.keyboard.disableRotation();
map.doubleClickZoom.disable();        // 連打でズームしてしまうのを防ぐ

// 1ピクセル = 何CSSピクセルか (MapLibreの世界の幅 = 512 * 2^zoom)
const pxPerPixel = (z) => 512 * Math.pow(2, z) / WORLD;
const zoomForPx = (p) => Math.log2(p * WORLD / 512);

const DRAW_MIN_PX = 0.3;    // これ以上でピクセルを表示 (ズーム約10)
const PAINT_MIN_PX = 3;     // これ以上で描ける (ズーム約13.5)
const GRID_MIN_PX = 8;      // マス目を表示
const CURSOR_MIN_PX = 3;    // カーソルを表示


let color = 3;            // パレット番号 (PAL の添字)
let erasing = false;      // 消しゴム
let paintMode = true;     // 描画モード (OFFなら地図を見るだけ)
let hover = null;         // {x, y} ポイント中の世界ピクセル
let dpr = 1;

const ov = document.getElementById('ov');
const octx = ov.getContext('2d');
map.getCanvasContainer().appendChild(ov);      // 地図の上 (操作系コントロールの下) に重ねる
const hintEl = document.getElementById('hint');
const posEl = document.getElementById('pos');
const paintBtn = document.getElementById('paintBtn');
const eraseBtn = document.getElementById('eraseBtn');

// ---- タイル管理 ----
// 色番号: 0=透明, 1..64 = PAL[0..63]
const LUT = new Uint32Array(PAL.length + 1);
PAL.forEach((h, i) => {
  const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
  LUT[i + 1] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;     // ImageData は ABGR(リトルエンディアン)
});

const tiles = new Map();      // "tx_ty" -> { state, idx, cv, cx, pending, used, retryAt, ... }
// state: queue(未取得) / loading / ready / empty(誰も描いていない) / error
let serverGen = 0;            // サーバー切替の世代 (古い応答を捨てる)
let active = false;           // サーバー接続前はタイルを取りにいかない
let inflight = 0;
const MAX_INFLIGHT = 6;
const MAX_CANVASES = window.matchMedia('(pointer: coarse)').matches ? 30 : 60;   // 1枚 約5MB
let frame = 0;
let visible = [];
let ctrTx = 0, ctrTy = 0;

function getTile(tx, ty) {
  const key = tx + '_' + ty;
  let e = tiles.get(key);
  if (!e) {
    e = { key, tx, ty, state: 'queue', idx: null, cv: null, cx: null, pending: null, used: frame, retryAt: 0 };
    tiles.set(key, e);
  }
  return e;
}

function allocTile(e, idx) {
  e.idx = idx || new Uint8Array(TILE * TILE);
  const cv = document.createElement('canvas');
  cv.width = cv.height = TILE;
  const cx = cv.getContext('2d');
  if (idx) {
    const img = cx.createImageData(TILE, TILE);
    const u32 = new Uint32Array(img.data.buffer);
    for (let i = 0; i < idx.length; i++) u32[i] = LUT[idx[i]];
    cx.putImageData(img, 0, 0);
  }
  e.cv = cv; e.cx = cx;
}

function setPixel(e, px, py, c) {
  if (!e.idx) { if (c === 0) return; allocTile(e); }
  e.idx[py * TILE + px] = c;
  if (c === 0) e.cx.clearRect(px, py, 1, 1);
  else { e.cx.fillStyle = PAL[c - 1] || '#000'; e.cx.fillRect(px, py, 1, 1); }
}

// 万一サーバー/プロキシが Content-Encoding を落としても読めるように
async function maybeGunzip(buf) {
  if (buf.length > 2 && buf[0] === 0x1f && buf[1] === 0x8b && window.DecompressionStream) {
    const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  return buf;
}

function loadTile(e) {
  const api = currentApi, gen = serverGen;
  e.state = 'loading'; e.pending = []; inflight++;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  fetch(`${api}?a=tile&x=${e.tx}&y=${e.ty}`, { signal: ctrl.signal })
    .then(async (r) => {
      if (r.status === 204) return null;                 // まだ誰も描いていないタイル
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const buf = await maybeGunzip(new Uint8Array(await r.arrayBuffer()));
      if (buf.length !== TILE * TILE) throw new Error('size');
      return buf;
    })
    .then((buf) => {
      if (gen !== serverGen) return;
      if (buf) allocTile(e, buf);
      e.state = buf ? 'ready' : 'empty';
      const pend = e.pending; e.pending = null;
      for (const p of pend) setPixel(e, p[0], p[1], p[2]);   // 読み込み中に届いた更新を反映
      requestDraw();
    })
    .catch(() => {
      if (gen !== serverGen) return;
      e.state = 'error'; e.retryAt = performance.now() + 4000; e.pending = null;
      setTimeout(requestDraw, 4100);
    })
    .finally(() => { clearTimeout(timer); inflight--; pump(); });
}

// 画面内のタイルを中心に近い順に読み込む
function pump() {
  if (!active) return;
  const now = performance.now();
  while (inflight < MAX_INFLIGHT) {
    let best = null, bd = Infinity;
    for (const e of visible) {
      if (e.state === 'queue' || (e.state === 'error' && now >= e.retryAt)) {
        const d = Math.abs(e.tx + 0.5 - ctrTx) + Math.abs(e.ty + 0.5 - ctrTy);
        if (d < bd) { bd = d; best = e; }
      }
    }
    if (!best) break;
    loadTile(best);
  }
}

// 画面外の古いタイルを捨てる (メモリ節約)。捨てたタイルは次に見えたとき最新を取り直す
function evict() {
  let alloc = 0;
  for (const e of tiles.values()) if (e.cv) alloc++;
  if (alloc <= MAX_CANVASES && tiles.size <= 3000) return;
  const old = [...tiles.values()].filter(e => e.used !== frame && e.state !== 'loading').sort((a, b) => a.used - b.used);
  for (const e of old) {
    if (alloc <= MAX_CANVASES && tiles.size <= 3000) break;
    if (e.cv) alloc--;
    tiles.delete(e.key);
  }
}

// ---- 描画 ----
let drawQueued = false;
function requestDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; drawOverlay(); });
}

function resizeOverlay() {
  dpr = window.devicePixelRatio || 1;
  ov.width = Math.round(view.clientWidth * dpr);
  ov.height = Math.round(view.clientHeight * dpr);
  drawOverlay();
}

function drawOverlay() {
  frame++;
  const vw = view.clientWidth, vh = view.clientHeight;
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, ov.width, ov.height);

  const pxs = pxPerPixel(map.getZoom());                 // 1ピクセルの大きさ (CSS px)
  const ctr = map.getCenter();
  const m = maplibregl.MercatorCoordinate.fromLngLat(ctr);
  const o = map.project(ctr);                            // 地図中心の画面座標
  const cxg = m.x * WORLD, cyg = m.y * WORLD;            // 中心の世界ピクセル座標
  const X = (g) => Math.round((o.x + (g - cxg) * pxs) * dpr);   // 世界ピクセル -> 画面(デバイスpx)
  const Y = (g) => Math.round((o.y + (g - cyg) * pxs) * dpr);
  const gL = cxg - o.x / pxs, gR = cxg + (vw - o.x) / pxs;       // 画面に見えている世界ピクセル範囲
  const gT = cyg - o.y / pxs, gB = cyg + (vh - o.y) / pxs;
  ctrTx = cxg / TILE; ctrTy = cyg / TILE;

  // ピクセルタイル
  visible = [];
  if (pxs >= DRAW_MIN_PX) {
    const tx0 = Math.max(0, Math.floor(gL / TILE)), tx1 = Math.min(NT - 1, Math.floor(gR / TILE));
    const ty0 = Math.max(0, Math.floor(gT / TILE)), ty1 = Math.min(NT - 1, Math.floor(gB / TILE));
    octx.imageSmoothingEnabled = pxs < 1;                // 縮小時はなめらかに、拡大時はくっきり(ドット)
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const e = getTile(tx, ty);
        e.used = frame;
        visible.push(e);
        if (!e.cv) continue;
        // 画面に見える範囲だけを切り出して描く (高倍率で巨大な描画先にならないように)
        const x0 = Math.max(tx * TILE, Math.floor(gL)), x1 = Math.min((tx + 1) * TILE, Math.ceil(gR));
        const y0 = Math.max(ty * TILE, Math.floor(gT)), y1 = Math.min((ty + 1) * TILE, Math.ceil(gB));
        if (x1 <= x0 || y1 <= y0) continue;
        octx.drawImage(e.cv, x0 - tx * TILE, y0 - ty * TILE, x1 - x0, y1 - y0,
                       X(x0), Y(y0), X(x1) - X(x0), Y(y1) - Y(y0));
      }
    }
  }

  // マス目
  if (paintMode && pxs >= GRID_MIN_PX) {
    const gx0 = Math.max(0, Math.floor(gL)), gx1 = Math.min(WORLD, Math.ceil(gR));
    const gy0 = Math.max(0, Math.floor(gT)), gy1 = Math.min(WORLD, Math.ceil(gB));
    octx.beginPath();
    for (let g = gx0; g <= gx1; g++) { const sx = X(g) + 0.5; octx.moveTo(sx, Y(gy0)); octx.lineTo(sx, Y(gy1)); }
    for (let g = gy0; g <= gy1; g++) { const sy = Y(g) + 0.5; octx.moveTo(X(gx0), sy); octx.lineTo(X(gx1), sy); }
    octx.lineWidth = 1;
    octx.strokeStyle = 'rgba(128,128,128,0.45)';
    octx.stroke();
  }

  // カーソル (選択中の色のプレビュー + 二重枠)
  if (hover && paintMode && pxs >= CURSOR_MIN_PX &&
      hover.x >= 0 && hover.x < WORLD && hover.y >= 0 && hover.y < WORLD) {
    const sx = X(hover.x), sy = Y(hover.y);
    const sw = X(hover.x + 1) - sx, sh = Y(hover.y + 1) - sy;
    if (erasing) { octx.fillStyle = 'rgba(255,255,255,0.55)'; octx.fillRect(sx, sy, sw, sh); }
    else { octx.globalAlpha = 0.7; octx.fillStyle = PAL[color]; octx.fillRect(sx, sy, sw, sh); octx.globalAlpha = 1; }
    const lw = Math.max(1, Math.round(dpr));
    octx.lineWidth = lw;
    octx.strokeStyle = '#000';
    octx.strokeRect(sx + lw / 2, sy + lw / 2, sw - lw, sh - lw);
    if (sw >= 6 * dpr) {
      octx.strokeStyle = '#fff';
      octx.strokeRect(sx + lw * 1.5, sy + lw * 1.5, sw - lw * 3, sh - lw * 3);
    }
  }

  // ズーム不足のヒント
  const needZoom = paintMode && pxs < PAINT_MIN_PX;
  if (hintEl.hidden === needZoom) hintEl.hidden = !needZoom;

  pump();
  if (frame % 30 === 0) evict();
}

map.on('render', drawOverlay);
map.on('resize', resizeOverlay);
map.on('moveend', () => {
  try {
    const c = map.getCenter();
    localStorage.setItem('dd_view', JSON.stringify({ lng: c.lng, lat: c.lat, zoom: map.getZoom() }));
  } catch (e) {}
});

// ---- 操作 ----
function pixelAt(lngLat) {
  const m = maplibregl.MercatorCoordinate.fromLngLat(lngLat);
  return { x: Math.floor(m.x * WORLD), y: Math.floor(m.y * WORLD) };
}
function updatePos() {
  posEl.textContent = (hover && hover.x >= 0 && hover.x < WORLD && hover.y >= 0 && hover.y < WORLD)
    ? `${hover.x}, ${hover.y}` : '-';
}
map.on('mousemove', (e) => { hover = pixelAt(e.lngLat); updatePos(); requestDraw(); });
map.on('touchstart', (e) => { if (e.lngLat) { hover = pixelAt(e.lngLat); updatePos(); requestDraw(); } });
view.addEventListener('pointerleave', (e) => {
  if (e.pointerType === 'mouse') { hover = null; updatePos(); requestDraw(); }
});

// タップ = その場に置く (クールタイムなし)
map.on('click', (e) => {
  if (!paintMode) return;
  hover = pixelAt(e.lngLat); updatePos();
  if (pxPerPixel(map.getZoom()) < PAINT_MIN_PX) {          // 遠いときはまずズームイン
    map.easeTo({ center: e.lngLat, zoom: zoomForPx(6), duration: 400 });
    return;
  }
  placeAt(hover.x, hover.y);
});
hintEl.addEventListener('click', () => map.easeTo({ zoom: zoomForPx(6), duration: 400 }));

function placeAt(gx, gy) {
  if (!(gx >= 0 && gx < WORLD && gy >= 0 && gy < WORLD)) return;
  const tx = Math.floor(gx / TILE), ty = Math.floor(gy / TILE);
  const e = tiles.get(tx + '_' + ty);
  if (!e || (e.state !== 'ready' && e.state !== 'empty')) return;   // タイル読み込み前は置けない
  const px = gx - tx * TILE, py = gy - ty * TILE;
  const c = erasing ? 0 : color + 1;
  const prev = e.idx ? e.idx[py * TILE + px] : 0;
  if (prev === c) return;

  const api = currentApi;
  const params = { a: 'place', x: gx, y: gy, c };
  setPixel(e, px, py, c);                    // 先に画面へ反映
  requestDraw();
  fetch(api, { method: 'POST', body: new URLSearchParams(params) })
    .then(r => { if (!r.ok) { const er = new Error(r.status); er.status = r.status; throw er; } })
    .catch((err) => {
      if (tiles.get(e.key) === e) { setPixel(e, px, py, prev); requestDraw(); }   // 失敗したら戻す
    });
}

function setErasing(v) {
  erasing = v;
  eraseBtn.setAttribute('aria-pressed', String(v));
  [...pal.children].forEach((el, j) => el.setAttribute('aria-pressed', String(!v && j === color)));
  drawOverlay();
}
eraseBtn.onclick = () => setErasing(!erasing);

function setPaintMode(v) {
  paintMode = v;
  paintBtn.setAttribute('aria-pressed', String(v));
  pal.hidden = !v;
  eraseBtn.hidden = !v;
  if (!v) hover = null;
  updateBarH();
  drawOverlay();
}
paintBtn.onclick = () => setPaintMode(!paintMode);

document.getElementById('zin').onclick = () => map.easeTo({ zoom: map.getZoom() + 1, duration: 250 });
document.getElementById('zout').onclick = () => map.easeTo({ zoom: map.getZoom() - 1, duration: 250 });

document.getElementById('locBtn').onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => map.flyTo({
      center: [pos.coords.longitude, pos.coords.latitude],
      zoom: Math.max(map.getZoom(), zoomForPx(6)), essential: true
    }),
    () => {
      const msg = t('locate_failed'), prev = status.textContent;
      status.textContent = msg;
      setTimeout(() => { if (status.textContent === msg) status.textContent = prev; }, 2500);
    },
    { timeout: 8000 }
  );
};

const styleSelect = document.getElementById('styleSelect');
styleSelect.value = mapStyle;
styleSelect.addEventListener('change', () => {
  mapStyle = styleSelect.value;
  try { localStorage.setItem('dd_style', mapStyle); } catch (e) {}
  map.setStyle(MAP_STYLES[mapStyle]);
});

window.addEventListener('load', updateDOMTranslations);
resizeOverlay();

// パレット生成
const pal = document.getElementById('pal');
PAL.forEach((hex, i) => {
  const b = document.createElement('button');
  b.style.background = hex;
  b.setAttribute('aria-label', t('color_prefix') + (i + 1));
  b.setAttribute('aria-pressed', i === color);
  b.onclick = () => {
    color = i;
    setErasing(false);
    [...pal.children].forEach((el, j) => el.setAttribute('aria-pressed', j === i));
  };
  pal.appendChild(b);
});

// SSE & サーバー接続管理
const dot = document.getElementById('dot'), status = document.getElementById('status');
let lastSeq = 0;
let currentEventSource = null;

// 他の人が置いたピクセルを反映 (読み込み済みのタイルだけ。未読込のタイルは取得時に最新が来る)
function applyRemote(gx, gy, c) {
  if (!(gx >= 0 && gx < WORLD && gy >= 0 && gy < WORLD)) return;
  const tx = Math.floor(gx / TILE), ty = Math.floor(gy / TILE);
  const e = tiles.get(tx + '_' + ty);
  if (!e) return;
  const px = gx - tx * TILE, py = gy - ty * TILE;
  if (e.state === 'loading') e.pending.push([px, py, c]);
  else if (e.state === 'ready' || e.state === 'empty') setPixel(e, px, py, c);
}

function connect(apiUrl, seq) {
  if (currentEventSource) {
    currentEventSource.close();
    currentEventSource = null;
  }

  lastSeq = seq;
  const es = new EventSource(`${apiUrl}?a=stream&from=${lastSeq}`);
  currentEventSource = es;

  es.onopen = () => { dot.className = 'on'; status.textContent = t('status_live'); };
  es.onmessage = (e) => {
    if (e.lastEventId) lastSeq = parseInt(e.lastEventId, 10) || lastSeq;
    for (const p of e.data.split(';')) {
      const [x, y, c] = p.split(',').map(Number);
      applyRemote(x, y, c);
    }
    requestDraw();
  };
  es.onerror = () => {
    dot.className = ''; status.textContent = t('status_reconnecting');
    if (es.readyState === EventSource.CLOSED && currentEventSource === es) {
      setTimeout(() => {
        if (currentEventSource === es) connect(apiUrl, lastSeq);
      }, 2000);
    }
  };
}

async function loadAndConnectServer(apiUrl) {
  connectChat(apiUrl);
  if (currentEventSource) {
    currentEventSource.close();
    currentEventSource = null;
  }

  // 前のサーバーのタイルを全部捨てる
  const gen = ++serverGen;
  tiles.clear();
  visible = [];
  active = true;

  dot.className = '';
  status.textContent = t('status_connecting');
  requestDraw();

  try {
    // 盤面全体は取らない。現在のシーケンス番号だけ取って、そこからストリームを購読する
    const res = await fetch(apiUrl + '?a=seq', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const seq = parseInt((await res.text()).trim(), 10) || 0;
    if (gen !== serverGen || apiUrl !== currentApi) return;
    connect(apiUrl, seq);
  } catch (e) {
    status.textContent = t('status_failed');
  }
}

// ---- チャット ----
const chatEl = document.getElementById('chat');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const chatBtn = document.getElementById('chatBtn');
const chatBadge = document.getElementById('chatBadge');
const chatDot = document.getElementById('chatDot');
const chatState = document.getElementById('chatState');
const chatNameBtn = document.getElementById('chatName');
const barEl = document.getElementById('bar');

function updateBarH() {
  document.documentElement.style.setProperty('--bar-h', barEl.offsetHeight + 'px');
  map.resize();   // 下部バーの高さが変わると地図領域も変わる
}
updateBarH();
if (window.ResizeObserver) new ResizeObserver(updateBarH).observe(barEl);
window.addEventListener('resize', updateBarH);

// 名前 (設定モーダル内の入力欄で編集)
let chatName = '';
try { chatName = localStorage.getItem('dd_name') || ''; } catch (e) {}
const nameInput = document.getElementById('nameInput');
function renderChatName() {
  chatNameBtn.textContent = chatName || t('chat_default_name');
  nameInput.placeholder = t('chat_default_name');
  if (document.activeElement !== nameInput) nameInput.value = chatName;
}
nameInput.addEventListener('input', () => {
  chatName = nameInput.value.trim().slice(0, 20);
  try { localStorage.setItem('dd_name', chatName); } catch (e) {}
  chatNameBtn.textContent = chatName || t('chat_default_name');
});
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); closeSettings(); }
});
chatNameBtn.onclick = () => openSettings(nameInput);

// ---- 設定モーダル ----
const settingsEl = document.getElementById('settings');
const settingsBtn = document.getElementById('settingsBtn');
const settingsClose = document.getElementById('settingsClose');
let settingsReturnFocus = null;

function openSettings(focusEl) {
  settingsReturnFocus = document.activeElement;
  settingsEl.hidden = false;
  (focusEl || settingsClose).focus();
}
function closeSettings() {
  if (settingsEl.hidden) return;
  settingsEl.hidden = true;
  serverMsg.textContent = '';
  if (settingsReturnFocus && settingsReturnFocus.focus) settingsReturnFocus.focus();
}
settingsBtn.onclick = () => openSettings();
settingsClose.onclick = closeSettings;

let downOnBackdrop = false;
settingsEl.addEventListener('pointerdown', (e) => { downOnBackdrop = e.target === settingsEl; });
settingsEl.addEventListener('click', (e) => { if (downOnBackdrop && e.target === settingsEl) closeSettings(); });
settingsEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); closeSettings(); return; }
  if (e.key !== 'Tab') return;
  const f = [...settingsEl.querySelectorAll('button, input, select')]
    .filter(el => !el.disabled && el.getClientRects().length);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

// 開閉 & 未読バッジ
let chatOpen = window.innerWidth >= 700;
let unread = 0;
function updateBadge() {
  chatBadge.hidden = unread === 0;
  chatBadge.textContent = unread > 99 ? '99+' : String(unread);
}
function setChatOpen(v) {
  chatOpen = v;
  chatEl.hidden = !v;
  if (v) {
    unread = 0; updateBadge();
    chatLog.scrollTop = chatLog.scrollHeight;
    if (window.matchMedia('(pointer: fine)').matches) chatInput.focus();
  }
}
chatBtn.onclick = () => setChatOpen(!chatOpen);
document.getElementById('chatClose').onclick = () => setChatOpen(false);

// 受信
const pad2 = n => String(n).padStart(2, '0');
let chatApi = '';
let chatES = null;
let chatTimer = null;
let chatRetry = 0;
let chatLive = false;
let lastChatId = 0;

function chatUrlFor(api) { return api.replace(/[^\/]*$/, 'chat.cgi'); }

function addChatMessage(m) {
  if (!m || !(m.id > lastChatId)) return;
  lastChatId = m.id;
  const atBottom = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 24;

  const row = document.createElement('div');
  const tEl = document.createElement('span');
  const d = new Date(m.t * 1000);
  tEl.className = 't';
  tEl.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const n = document.createElement('b');
  n.textContent = m.n || t('chat_default_name');
  const x = document.createElement('span');
  x.textContent = m.m;
  row.append(tEl, n, x);
  chatLog.appendChild(row);
  while (chatLog.children.length > 200) chatLog.removeChild(chatLog.firstChild);

  if (atBottom) chatLog.scrollTop = chatLog.scrollHeight;
  if (!chatOpen && chatLive) { unread++; updateBadge(); }
}

function disconnectChat() {
  clearTimeout(chatTimer);
  if (chatES) { chatES.close(); chatES = null; }
}

function openChatStream() {
  const es = new EventSource(`${chatApi}?a=stream&from=${lastChatId}`);
  chatES = es;
  es.onopen = () => {
    chatDot.className = 'on'; chatState.textContent = '';
    chatLive = false; chatRetry = 0;
  };
  es.onmessage = (e) => { try { addChatMessage(JSON.parse(e.data)); } catch (_) {} };
  es.addEventListener('ready', () => {
    chatLive = true;
    chatLog.scrollTop = chatLog.scrollHeight;
  });
  es.onerror = () => {
    chatDot.className = '';
    if (es.readyState === EventSource.CLOSED && chatES === es) {
      chatState.textContent = t('chat_cannot_connect');
      const wait = Math.min(30000, 2000 * Math.pow(2, chatRetry++));
      chatTimer = setTimeout(() => { if (chatES === es) openChatStream(); }, wait);
    } else {
      chatState.textContent = t('chat_reconnecting');
    }
  };
}

function connectChat(apiUrl) {
  disconnectChat();
  chatApi = chatUrlFor(apiUrl);
  lastChatId = 0; chatRetry = 0; chatLive = false;
  chatLog.textContent = '';
  unread = 0; updateBadge();
  chatDot.className = ''; chatState.textContent = t('status_connecting');
  openChatStream();
}

// 送信
async function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !chatApi) return;
  chatSend.disabled = true;
  let msg = '';
  try {
    const r = await fetch(chatApi, {
      method: 'POST',
      body: new URLSearchParams({ a: 'post', name: chatName || t('chat_default_name'), text })
    });
    if (r.ok) {
      chatInput.value = '';
    } else {
      try { msg = (await r.json()).error || ''; } catch (_) {}
      msg = msg || t('chat_send_failed');
    }
  } catch (_) {
    msg = t('chat_send_failed');
  }
  chatSend.disabled = false;
  if (msg) {
    chatState.textContent = msg;
    setTimeout(() => { if (chatState.textContent === msg) chatState.textContent = ''; }, 3000);
  }
  chatInput.focus();
}
chatSend.onclick = sendChat;
chatSend.addEventListener('mousedown', (e) => e.preventDefault());
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    sendChat();
  }
});

setChatOpen(chatOpen);
setPaintMode(true);

// 起動処理
loadAndConnectServer(currentApi);
</script>
